<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>contentHub · 主题库 — AppShell</title>
<style>
/* ============================================================================
   contentHub AppShell
   1:1 还原自 Ardot 画布「contentHub UI 设计规范」/ F4 页面示例 AppShell
   Screen 画布尺寸 1344 x 780  ·  保留原始像素 + 等比缩放
   Token 命名与 v1.1 规范 10.x 节保持一致
   ========================================================================= */

:root{
  /* ---- 底色层级 Background ---- */
  --ch-bg-base:     #030712;
  --ch-bg-sidebar:  #111827;
  --ch-bg-surface:  #1F2937;
  --ch-bg-elevated: #374151;
  --ch-bg-input:    #0B1220;
  --ch-bg-hover:    rgba(31, 41, 55, .30);   /* bg/hover = bg/surface 30% */

  /* ---- 文字层级 Text ---- */
  --ch-text-primary:   #F3F4F6;
  --ch-text-secondary: #9CA3AF;
  --ch-text-tertiary:  #6B7280;
  --ch-text-disabled:  #4B5563;
  --ch-text-inverse:   #111827;

  /* ---- 功能色 Functional ---- */
  --ch-primary:        #3B82F6;
  --ch-primary-active: #2563EB;
  --ch-success:        #10B981;
  --ch-warning:        #F59E0B;
  --ch-danger:         #EF4444;
  --ch-info:           #06B6D4;   /* 「已渲染」完成度指示色 */

  /* ---- 平台识别色 Platform ---- */
  --ch-wechat:  #07C160;
  --ch-xhs:     #FF2442;
  --ch-generic: #6B7280;

  /* ---- 描边 Border ---- */
  --ch-border:       #374151;   /* border/default */
  --ch-border-light: #4B5563;   /* border/light */
  --ch-border-focus: #3B82F6;   /* border/focus */

  /* ---- 间距刻度 Spacing · 4px 基准 ---- */
  --sp-xs: 4px;  --sp-sm: 8px;  --sp-md: 12px; --sp-lg: 16px; --sp-xl: 20px;
  --sp-2xl: 24px; --sp-3xl: 32px; --sp-4xl: 40px; --sp-5xl: 48px;

  /* ---- 圆角 Radius ---- */
  --r-sm: 4px; --r-md: 6px; --r-lg: 8px; --r-xl: 12px; --r-2xl: 16px; --r-full: 999px;

  /* ---- 阴影与描边 Elevation ---- */
  --sh-raised: 0 4px 16px rgba(0, 0, 0, .40);
  --sh-modal:  0 8px 32px rgba(0, 0, 0, .50);
  --sh-focus:  0 0 0 3px rgba(59, 130, 246, .25);

  /* ---- 字体 ---- */
  --font-cjk: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
  --font-mono: "JetBrains Mono", Consolas, ui-monospace, monospace;

  /* ---- 结构常量（来自 4.1 全局框架）---- */
  --shell-w: 1344px;
  --shell-h: 780px;
  --sidebar-w: 240px;
  --topbar-h: 56px;
  --nav-h: 36px;
  --col-status: 96px;
  --col-platform: 180px;
  --col-updated: 110px;
}

*,*::before,*::after{ box-sizing: border-box; }

html,body{ height:100%; margin:0; }
body{
  background: var(--ch-bg-base);
  font-family: var(--font-cjk);
  color: var(--ch-text-primary);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}

/* 画布容器：锁死 1344x780，整体等比缩放居中，不重排 */
.stage{
  position: absolute;
  left: 50%; top: 50%;
  width: var(--shell-w);
  height: var(--shell-h);
  transform-origin: center center;
}

/* ============================================================================
   Screen  1344 x 780  ·  radius 16  ·  border 1px
   ========================================================================= */
.screen{
  display: flex;
  width: 100%; height: 100%;
  background: var(--ch-bg-base);
  border: 1px solid var(--ch-border);
  border-radius: var(--r-2xl);
  overflow: hidden;
}

/* ---------------------------------------------------------------- Sidebar 240 */
.sidebar{
  flex: 0 0 var(--sidebar-w);
  display: flex; flex-direction: column;
  gap: 6px;
  padding: var(--sp-lg);
  background: var(--ch-bg-sidebar);
}

.logo-row{
  display: flex; align-items: center; gap: 10px;
  height: 44px;
}
.logo-mark{
  width: 28px; height: 28px;
  border-radius: var(--r-lg);
  background: var(--ch-primary);
  flex: none;
}
.logo-text{
  font-size: 15px; font-weight: 600; line-height: 1;
  color: var(--ch-text-primary);
  letter-spacing: -.01em;
}

.nav-item{
  display: flex; align-items: center; gap: 10px;
  height: var(--nav-h);
  padding: var(--sp-sm);
  border: 0; margin: 0;
  border-radius: var(--r-lg);
  background: transparent;
  font-family: inherit;
  font-size: 14px; font-weight: 400; line-height: 1;
  color: var(--ch-text-secondary);
  text-align: left;
  cursor: pointer;
  transition: background-color .12s ease, color .12s ease;
}
/* 图标配色交给 SVG 自身的 currentColor —— 不用 CSS 通配覆盖，
   否则会把「素材图库」那种 fill="none" 的描边矩形一起填实 */
.nav-item .nav-icon{ flex: none; width: 16px; height: 16px; display: block; }

.nav-item:hover{ background: var(--ch-bg-hover); }

/* 选中态：primary 12% 填充 + 主色图标 + 主色文字 */
.nav-item[aria-current="page"]{
  background: rgba(59, 130, 246, .12);
  color: var(--ch-text-primary);
  font-weight: 500;
}
.nav-item[aria-current="page"] .nav-icon{ color: var(--ch-primary); }

/* 系统设置：tertiary 层级（画布中该图标与文字均为 #6B7280） */
.nav-item.is-tertiary{ color: var(--ch-text-tertiary); }

/* ------------------------------------------------------------------- Main */
.main{ flex: 1 1 auto; display: flex; flex-direction: column; min-width: 0; }

/* ---------------------------------------------------------------- TopBar 56 */
.topbar{
  flex: none;
  display: flex; align-items: center; justify-content: space-between;
  height: var(--topbar-h);
  padding: 0 var(--sp-lg);
  background: var(--ch-bg-sidebar);
}
.breadcrumb{ font-size: 14px; line-height: 1; color: var(--ch-text-secondary); }
.topbar-right{ display: flex; align-items: center; gap: var(--sp-md); }

.search-box{
  display: flex; align-items: center;
  width: 200px; height: 32px;
  padding: 0 10px;
  background: var(--ch-bg-input);
  border: 1px solid var(--ch-border);
  border-radius: var(--r-md);
  transition: border-color .12s ease, box-shadow .12s ease;
}
.search-box:focus-within{
  border-color: var(--ch-border-focus);
  box-shadow: var(--sh-focus);
}
.search-box input{
  width: 100%; border: 0; padding: 0;
  background: transparent; outline: none;
  font-family: inherit; font-size: 13px; line-height: 1;
  color: var(--ch-text-primary);
}
.search-box input::placeholder{ color: var(--ch-text-tertiary); }

.avatar{
  width: 28px; height: 28px; flex: none;
  border-radius: var(--r-full);
  /* 画布 F4 Screen/Avatar 实测填充 = #4B5563（值与 border/light 同色） */
  background: var(--ch-border-light);
}

/* --------------------------------------------------------------- Content 24 */
.content{
  flex: 1 1 auto;
  display: flex; flex-direction: column;
  gap: var(--sp-xl);
  padding: var(--sp-2xl);
  min-height: 0;
}

.page-header{
  display: flex; align-items: center; justify-content: space-between;
}
.page-title{
  margin: 0;
  font-size: 22px; font-weight: 600; line-height: 1.35;
  color: var(--ch-text-primary);
}

/* ------------------------------------------------------------------ Button */
.btn{
  display: inline-flex; align-items: center; justify-content: center;
  height: 36px; padding: 0 18px;
  border: 1px solid transparent;
  border-radius: var(--r-lg);
  font-family: inherit; font-size: 14px; font-weight: 500; line-height: 1;
  cursor: pointer;
  transition: background-color .12s ease, border-color .12s ease, color .12s ease;
}
/* 页面主按钮固定 112px —— 与画布 F4 Page Header / Button Primary 一致 */
.btn-primary{ background: var(--ch-primary); color: #FFFFFF; min-width: 112px; }
.btn-primary:hover{ background: var(--ch-primary-active); }
.btn:focus-visible{
  outline: none;
  border-color: var(--ch-border-focus);
  box-shadow: var(--sh-focus);
}

/* ------------------------------------------------------------------- Table */
.table{
  background: var(--ch-bg-surface);
  border: 1px solid var(--ch-border);
  border-radius: var(--r-xl);
  overflow: hidden;
}

.row{
  display: flex; align-items: stretch;
  border-bottom: 1px solid var(--ch-border);
}
.row:last-child{ border-bottom: 0; }
.row-head{ height: 40px; background: var(--ch-bg-elevated); }
.row-body{ height: 44px; }
.row-body.is-interactive{ cursor: pointer; transition: background-color .1s ease; }
.row-body.is-interactive:hover{ background: rgba(55, 65, 81, .35); }

.cell{ display: flex; align-items: center; padding: 10px; min-width: 0; }
.cell-title{ flex: 1 1 auto; }
.cell-status{ flex: 0 0 var(--col-status); gap: 5px; padding: 5px 10px; }
.cell-platform{ flex: 0 0 var(--col-platform); gap: var(--sp-sm); }
.cell-updated{ flex: 0 0 var(--col-updated); }

/* 表头：13px / 500 / text.secondary，行高 40 */
.row-head .cell{ font-size: 13px; font-weight: 500; line-height: 1; color: var(--ch-text-secondary); }

/* 数据行文案层级 */
.row-body .cell-title{ font-size: 14px; line-height: 1.4; color: var(--ch-text-primary); }
.row-body .cell-updated{ font-size: 13px; line-height: 1.5; color: var(--ch-text-tertiary); }
.row-body .cell-platform{ font-size: 13px; line-height: 1.5; color: var(--ch-text-secondary); }
.row-body .cell-platform.is-empty{ color: var(--ch-text-disabled); }

/* 平台识别圆点 */
.dot{ width: 8px; height: 8px; flex: none; border-radius: var(--r-full); background: var(--ch-generic); }
.dot-wechat{ background: var(--ch-wechat); }
.dot-xhs{ background: var(--ch-xhs); }

/* 状态：完成度指示器（不是状态徽章，用 info 色圆点 + 同色文字） */
.status-plain{
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 12px; font-weight: 500; line-height: 1.4;   /* Caption 12/1.4 */
  color: var(--ch-info);
}
.status-plain .dot{ background: currentColor; }

/* 状态徽章 StateBadge：18% 同色底 + 圆点 + 12px/500 文字，radius full
   行高沿用 Caption 的 1.4 —— 实测徽章总高 5+17+5 = 27px，与画布一致 */
.badge{
  display: inline-flex; align-items: center; gap: 5px;
  padding: 5px;
  border-radius: var(--r-full);
  font-size: 12px; font-weight: 500; line-height: 1.4;
}
.badge .dot{ background: currentColor; }
.badge-draft{ background: rgba(99, 115, 140, .18); color: var(--ch-text-secondary); }
.badge-drafted{ background: rgba(59, 130, 246, .18); color: var(--ch-primary); }

/* 未定义页面的诚实占位（不虚构设计） */
.empty-page{
  display: flex; align-items: center; justify-content: center;
  flex: 1 1 auto;
  border: 1px dashed var(--ch-border-light);
  border-radius: var(--r-xl);
  font-size: 13px; line-height: 1.5;
  color: var(--ch-text-tertiary);
  text-align: center;
  padding: var(--sp-2xl);
}

/* 无障碍：尊重减少动效偏好 */
@media (prefers-reduced-motion: reduce){
  *{ transition: none !important; }
}
</style>
</head>

<div class="stage" id="stage">
  <div class="screen">

    <!-- ============================================================ Sidebar -->
    <aside class="sidebar" aria-label="主导航">
      <div class="logo-row">
        <span class="logo-mark" aria-hidden="true"></span>
        <span class="logo-text">contentHub</span>
      </div>
      <nav id="nav" style="display:flex;flex-direction:column;gap:6px"></nav>
    </aside>

    <!-- =============================================================== Main -->
    <div class="main">

      <!-- TopBar 56 -->
      <header class="topbar">
        <span class="breadcrumb" id="breadcrumb">主题库  /  全部主题</span>
        <div class="topbar-right">
          <div class="search-box">
            <input type="search" id="search" placeholder="搜索标题或编码" aria-label="搜索标题或编码" />
          </div>
          <span class="avatar" role="img" aria-label="用户头像"></span>
        </div>
      </header>

      <!-- Content 24 -->
      <main class="content">
        <div class="page-header">
          <h1 class="page-title" id="pageTitle">主题库</h1>
          <button class="btn btn-primary" id="btnPrimary" type="button">新建主题</button>
        </div>

        <div id="slot"></div>
      </main>
    </div>

  </div>
</div>

function icon(name){
  return '<svg class="nav-icon" viewBox="0 0 16 16" aria-hidden="true" focusable="false">' + ICONS[name] + '</svg>';
}

/* ============================================================================
 * 导航：与画布 Sidebar 完全一致的 7 项与顺序
 * isTertiary 对应画布中 #6B7280 那一项（系统设置）
 * ========================================================================= */
const NAV = [
  { id: 'workspace', label: '工作台',   icon: 'home'   },
  { id: 'topics',    label: '主题库',   icon: 'layers' },
  { id: 'assets',    label: '素材图库', icon: 'image'  },
  { id: 'render',    label: '渲染任务', icon: 'render' },
  { id: 'delivery',  label: '投递记录', icon: 'send'   },
  { id: 'compliance',label: '合规校验', icon: 'shield' },
  { id: 'settings',  label: '系统设置', icon: 'gear', isTertiary: true }
];

/* ============================================================================
 * 主题库表格数据 —— 逐字取自画布 F4 Table / Row 1-3
 * status 三态刻意各不相同，用来展示三种不同表达：
 *   plain   完成度指示器（info 色）       —— 「已渲染」
 *   draft   状态徽章 · 中性              —— 「草稿」
 *   drafted 状态徽章 · primary           —— 「已推草稿」
 * ========================================================================= */
const TOPICS = [
  {
    title: '敦煌壁画的色谱研究',
    status: { kind: 'plain', text: '已渲染' },
    platforms: ['wechat', 'xhs'],
    platformText: '微信 · 小红书',
    updated: '2 小时前'
  },
  {
    title: '宋代点茶考据与器皿形制',
    status: { kind: 'draft', text: '草稿' },
    platforms: [],
    platformText: '未选平台',
    updated: '1 天前'
  },
  {
    title: '明代家具榫卯结构图解',
    status: { kind: 'drafted', text: '已推草稿' },
    platforms: ['wechat'],
    platformText: '微信公众号',
    updated: '3 天前'
  }
];

const PLATFORM_CLASS = { wechat: 'dot-wechat', xhs: 'dot-xhs', generic: '' };

/* --------------------------------------------------------------- 渲染函数 */
function renderNav(activeId){
  document.getElementById('nav').innerHTML = NAV.map(function(item){
    var current = item.id === activeId ? ' aria-current="page"' : '';
    var tertiary = item.isTertiary ? ' is-tertiary' : '';
    return '<button type="button" class="nav-item' + tertiary + '" data-nav="' + item.id + '"' + current + '>'
         +   icon(item.icon)
         +   '<span>' + item.label + '</span>'
         + '</button>';
  }).join('');
}

function renderStatus(status){
  if (status.kind === 'plain'){
    return '<span class="status-plain"><span class="dot"></span>' + status.text + '</span>';
  }
  return '<span class="badge badge-' + status.kind + '"><span class="dot"></span>' + status.text + '</span>';
}

function renderPlatforms(row){
  if (!row.platforms.length){
    return '<div class="cell cell-platform is-empty">' + row.platformText + '</div>';
  }
  var dots = row.platforms.map(function(p){
    return '<span class="dot ' + PLATFORM_CLASS[p] + '"></span>';
  }).join('');
  return '<div class="cell cell-platform">' + dots + '<span>' + row.platformText + '</span></div>';
}

function renderTable(){
  var head = '<div class="row row-head">'
    + '<div class="cell cell-title">标题</div>'
    + '<div class="cell cell-status">状态</div>'
    + '<div class="cell cell-platform">平台</div>'
    + '<div class="cell cell-updated">更新时间</div>'
    + '</div>';

  var body = TOPICS.map(function(row){
    return '<div class="row row-body is-interactive" tabindex="0">'
      + '<div class="cell cell-title">' + row.title + '</div>'
      + '<div class="cell cell-status">' + renderStatus(row.status) + '</div>'
      + renderPlatforms(row)
      + '<div class="cell cell-updated">' + row.updated + '</div>'
      + '</div>';
  }).join('');

  return '<div class="table" role="table" aria-label="主题列表">' + head + body + '</div>';
}

/* ----------------------------------------------------- 路由（纯前端壳层） */
function render(pageId){
  var item = NAV.filter(function(n){ return n.id === pageId; })[0] || NAV[1];
  var isTopics = item.id === 'topics';

  renderNav(item.id);
  document.getElementById('breadcrumb').textContent = isTopics
    ? '主题库  /  全部主题'
    : item.label + '  /  全部';
  document.getElementById('pageTitle').textContent = item.label;

  // 「新建主题」只在主题库页出现（与画布 F4 一致）
  document.getElementById('btnPrimary').style.display = isTopics ? '' : 'none';

  document.getElementById('slot').innerHTML = isTopics
    ? renderTable()
    : '<div class="empty-page">「' + item.label + '」在 v1.1 设计稿中只有导航入口，<br />未提供页面示例（F4 仅定义了主题库 P-02）。</div>';
}

/* ------------------------------------------------------------------ 事件 */
document.getElementById('nav').addEventListener('click', function(e){
  var btn = e.target.closest('[data-nav]');
  if (btn) render(btn.dataset.nav);
});

document.getElementById('btnPrimary').addEventListener('click', function(){
  if (typeof console !== 'undefined') console.log('[contentHub] 新建主题 —— 接入时跳转主题创建流程');
});

/* ---------------------------------------------------- 等比缩放：锁死像素 */
var stage = document.getElementById('stage');
function fit(){
  var scale = Math.min(
    window.innerWidth  / 1344,
    window.innerHeight / 780,
    1                                   /* 上限 1：不放大小尺寸画布，保持原始像素 */
  );
  stage.style.transform = 'translate(-50%, -50%) scale(' + scale + ')';
}
window.addEventListener('resize', fit);

fit();
render('topics');
</script>
