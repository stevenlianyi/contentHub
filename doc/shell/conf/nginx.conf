        #ssl_certificate     /data/cert/mindgram.iottest.online.pem;
        #ssl_certificate_key /data/cert/mindgram.iottest.online.key;

        ssl_session_cache    shared:SSL:10m;
        ssl_session_timeout  1h; # 1 hour during which sessions can be re-used.

