        }

        # account internal service
        location /acis{
            proxy_pass http://127.0.0.1:16021; # 这里是指向 gunicorn host 的服务地址
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # moniotr service, service watch dog, monitor all service activies,
        location /swatchdog{
            proxy_pass http://127.0.0.1:16091; # 这里是指向 gunicorn host 的服务地址
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # swupgrad internal service
        location /swupgrade{
            proxy_pass http://127.0.0.1:16095; # 这里是指向 gunicorn host 的服务地址
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
	
    }

